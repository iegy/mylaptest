name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hisn-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Check project files
        run: |
          ls -la
          test -f settings.gradle.kts -o -f settings.gradle && echo "settings ok" || echo "MISSING settings.gradle"
          test -f gradlew && echo "gradlew ok" || echo "MISSING gradlew"

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew missing — cannot build"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hisn-Browser-APK
          path: |
            Hisn-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
