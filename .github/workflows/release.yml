name: Release

# Runs only when a version tag such as v1.0.0 is pushed. It never runs for pull requests,
# so signing secrets are never exposed to untrusted code.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed only to create the GitHub Release and attach the APK

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Work out version and whether signing is configured
        id: meta
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. No release will be published; a debug APK artifact is produced instead."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest -Phisn.versionName=${{ steps.meta.outputs.version }}

      # ---- Signed release path ---------------------------------------------------------------------------
      - name: Decode keystore to a temporary file
        if: steps.meta.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/hisn-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          echo "HISN_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.meta.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon assembleRelease
          -Phisn.versionName=${{ steps.meta.outputs.version }}
          -Phisn.versionCode=${{ github.run_number }}

      - name: Verify the release APK is signed
        if: steps.meta.outputs.signed == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed release APK not found at $APK (an unsigned build would be named app-release-unsigned.apk)."
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/Hisn-Browser-${{ steps.meta.outputs.version }}.apk"

      - name: Publish GitHub Release
        if: steps.meta.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: HISN Browser ${{ steps.meta.outputs.version }}
          files: dist/Hisn-Browser-${{ steps.meta.outputs.version }}.apk
          generate_release_notes: true
          body: |
            **حصن — HISN Browser ${{ steps.meta.outputs.version }}**

            Designed & Developed by Mohammed Hussein | iegy.net
            © 2026 Mohammed Hussein. All rights reserved.

            Signed release APK. Android may ask you to allow installing apps from the source you downloaded it from.
            Requires Android 9 (API 28) or newer. See the README for limitations.

      # ---- Fallback when signing is not configured -------------------------------------------------------
      - name: Build debug APK (signing not configured)
        if: steps.meta.outputs.signed != 'true'
        run: >
          ./gradlew --no-daemon assembleDebug
          -Phisn.versionName=${{ steps.meta.outputs.version }}
          -Phisn.versionCode=${{ github.run_number }}

      - name: Prepare debug APK artifact
        if: steps.meta.outputs.signed != 'true'
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "::error::Debug APK not found"; exit 1; }
          mkdir -p dist
          cp "$APK" dist/Hisn-Browser-debug.apk

      - name: Upload debug APK (signing not configured)
        if: steps.meta.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hisn-Browser-APK
          path: dist/Hisn-Browser-debug.apk
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: |
          if [ -n "${HISN_KEYSTORE_PATH:-}" ]; then
            shred -u "$HISN_KEYSTORE_PATH" 2>/dev/null || rm -f "$HISN_KEYSTORE_PATH"
          fi
