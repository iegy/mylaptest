name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow never needs to write to the repository, and it has no access to signing secrets.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # AGP 8.7 + Gradle 8.10 require JDK 17 or newer; 17 is the pinned, supported choice.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # التوقيع بمفتاح ثابت (من الـ secrets) حتى تُثبَّت كل نسخة جديدة فوق القديمة دون "App not installed".
      # يعمل فقط عند وجود الـ secrets (لا تصل لطلبات pull من forks). بدونها يُبنى APK بمفتاح debug عشوائي كما كان.
      - name: Prepare fixed signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            KEYSTORE_FILE="$RUNNER_TEMP/hisn-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "HISN_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Fixed signing key will be used for the debug APK."
          else
            echo "::warning::Signing secrets not set; the debug APK gets a random key and cannot update an installed copy."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -Phisn.versionCode=${{ github.run_number }}

      - name: Verify the APK exists and give it a predictable name
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK was not produced: $APK"
            ls -R app/build/outputs || true
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Hisn-Browser-debug.apk
          ls -l dist/Hisn-Browser-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisn-Browser-APK
          path: dist/Hisn-Browser-debug.apk
          if-no-files-found: error

      - name: Remove temporary signing files
        if: always()
        run: |
          if [ -n "${HISN_KEYSTORE_PATH:-}" ]; then
            shred -u "$HISN_KEYSTORE_PATH" 2>/dev/null || rm -f "$HISN_KEYSTORE_PATH"
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hisn-Browser-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
