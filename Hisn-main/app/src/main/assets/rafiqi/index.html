<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>رفيقي — محلي</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      margin: 0; padding: 24px;
      background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; box-sizing: border-box;
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { opacity: .85; text-align: center; max-width: 28rem; line-height: 1.6; }
    a.btn {
      display: inline-block; margin-top: 20px; padding: 12px 22px;
      background: #0ea5e9; color: #0f172a; text-decoration: none;
      border-radius: 12px; font-weight: 600;
    }
    .hint {
      margin-top: 32px; font-size: .85rem; opacity: .6;
      border-top: 1px solid #334155; padding-top: 16px; max-width: 28rem;
    }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>رفيقي</h1>
  <p>هذه نسخة محلية داخل متصفح حصن. ضع ملفات بناء رفيقي (مجلد <code>dist/</code>) داخل <code>assets/rafiqi/</code> ليشتغل التطبيق بالكامل دون إنترنت.</p>
  <a class="btn" href="https://rafiqi.iegy.net/">فتح النسخة على الإنترنت</a>
  <div class="hint">
    بعد نسخ الملفات، أعد بناء التطبيق. الجسر الأصلي متاح عبر <code>window.HisnRafiqi</code>
    لجدولة تنبيهات الصلاة.
  </div>
  <script>
    // Detect native bridge
    if (window.HisnRafiqi) {
      console.log('Hisn Rafiqi bridge v' + (window.HisnRafiqi.getVersion && window.HisnRafiqi.getVersion()));
    }
  </script>
</body>
</html>
